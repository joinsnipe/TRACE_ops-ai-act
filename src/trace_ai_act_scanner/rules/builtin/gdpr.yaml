# GDPR (Regulation (EU) 2016/679) — Overlap with EU AI Act
# https://gdpr-info.eu/

- id: GDPR_PERSONAL_DATA_PROCESSING
  bucket: gdpr_data_protection_overlap
  legal_basis: "GDPR + EU AI Act complementarity"
  label: "Potential personal data processing / profiling overlap"
  severity: DATA_PROTECTION_REVIEW
  weight: 18
  exact_terms:
    - personal_data
    - pii
    - profile
    - data
    - location
    - trust
    - score
    - profiling
    - user_id
    - email
    - phone
    - biometric
    - health
    - criminal
    - sensitive
  term_exclusions:
    profile:
      exclude_if_parent: ["company_", "brand_", "corporate_"]
    data:
      exclude_if_assign: ["statistical_", "aggregated_", "anonymous_"]
    location:
      exclude_if_parent: ["registration_", "office_", "headquarters_"]
    trust:
      exclude_if_context: ["b2b"]
      exclude_if_assign: ["corporate_score"]
    score:
      exclude_if_context: ["b2b"]
      exclude_if_assign: ["spe_score_company"]
  phrases:
    - "personal data"
    - "data subject"
    - "special category"
    - "automated decision"
    - "solely automated"
    - "data minimisation"
    - "data minimization"
  context_terms:
    - collect
    - process
    - store
    - infer
    - predict
    - identify
    - consent
    - legitimate_interest
  guidance: >
    If personal data is processed, GDPR controls must sit beside AI Act
    controls. If applied to B2B or system telemetry, add a .traceignore entry.
  contradicts_public_claims:
    - "we do not collect personal data"
    - "fully anonymous"
    - "GDPR-compliant by design"
