# EU AI Act — Article 5 (Prohibited AI Practices)
# https://artificialintelligenceact.eu/article/5/
#
# Each rule's `contradicts_public_claims` is OPTIONAL metadata consumed by the
# proprietary SPE Audit Reporting layer for narrative-vs-code alignment. The
# open-source scanner ignores it.

- id: A5_MANIPULATION_SUBLIMINAL_EXPLOITATIVE
  bucket: article_5_prohibited_practice_signal
  legal_basis: "EU AI Act Article 5"
  label: "Potential manipulative, subliminal or exploitative practice"
  severity: ARTICLE_5_REVIEW_REQUIRED
  weight: 35
  exact_terms:
    - subliminal
    - manipulate
    - manipulation
    - exploit
    - exploitative
    - vulnerability
  phrases:
    - "dark pattern"
    - "cognitive distortion"
    - "materially distort"
    - "behaviour manipulation"
    - "behavior manipulation"
  context_terms:
    - user
    - person
    - child
    - consumer
    - decision
    - choice
    - behaviour
    - behavior
  guidance: >
    Check whether the system materially distorts behaviour or exploits
    vulnerability. If yes, legal review is mandatory before deployment.
  contradicts_public_claims:
    - "we do not manipulate users"
    - "ethical UX design"
    - "no dark patterns"

- id: A5_SOCIAL_SCORING
  bucket: article_5_prohibited_practice_signal
  legal_basis: "EU AI Act Article 5"
