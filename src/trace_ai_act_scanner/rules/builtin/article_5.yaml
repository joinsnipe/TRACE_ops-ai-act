- id: A5_BIOMETRIC_CATEGORISATION_SENSITIVE
  bucket: article_5_prohibited_practice_signal
  legal_basis: "EU AI Act Article 5 + GDPR special categories"
  label: "Potential biometric categorisation to infer sensitive attributes"
  severity: ARTICLE_5_REVIEW_REQUIRED
  weight: 40
  exact_terms:
    - race
    - ethnicity
    - religion
    - political
    - sexual_orientation
    - trade_union
  phrases:
    - "biometric categorisation"
    - "biometric categorization"
    - "infer race"
    - "infer ethnicity"
    - "political opinion"
    - "trade union"
    - "sexual orientation"
  context_terms:
    - classify
    - categorize
    - categorise
    - infer
    - deduce
    - attribute
    - sensitive
  required_context:
    - biometric
    - face
    - fingerprint
    - iris
    - gait
    - voiceprint
    - facial
  negative_terms:
    - hair_colour
    - hair_color
    - eye_colour
    - eye_color
    - product_filter
    - avatar_filter
  guidance: >
    Check if biometric data is used to infer protected or sensitive
    attributes. Requires biometric + sensitive context.
  contradicts_public_claims:
    - "no biometric data"
    - "no facial recognition"
    - "no profiling of sensitive attributes"
    - "anonymous by design"

