# EU AI Act — Governance Controls (Chapter III, Sections 2-3)
# These rules represent evidence of governance controls, NOT risks.
# Detecting them increases readiness_score and reduces missing_controls.

- id: CTRL_RISK_MANAGEMENT
  bucket: governance_control
  legal_basis: "EU AI Act Article 9"
  label: "Risk management system"
  severity: CONTROL
  weight: -8
  exact_terms:
    - risk_management
    - risk_register
    - risk_assessment
  phrases:
    - "risk management"
    - "risk register"

