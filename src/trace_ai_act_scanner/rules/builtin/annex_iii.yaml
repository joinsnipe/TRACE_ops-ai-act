- id: AIII_EMPLOYMENT_WORKER_MANAGEMENT
  bucket: annex_iii_high_risk_signal
  legal_basis: "EU AI Act Annex III(4)"
  label: "Potential high-risk employment, recruitment or worker-management system"
  severity: HIGH_RISK_REVIEW
  weight: 32
  exact_terms:
    - auto_reject
    - cv_score
    - resume_score
    - candidate_score
    - rank_candidate
    - shift_allocation
    - worker_monitoring
    - performance_score
  phrases:
    - "filter cv"
    - "resume parser"
    - "candidate ranking"
    - "employee monitoring"
    - "worker performance"
    - "task allocation"
  context_terms:
    - candidate
    - employee
    - worker
    - job
    - recruitment
    - hiring
    - promotion
    - termination
  guidance: >
    Employment AI is a core high-risk area. Check whether output materially
    affects hiring, allocation, monitoring or termination.
  contradicts_public_claims:
    - "humans make all hiring decisions"
    - "no automated CV screening"
    - "no employee monitoring"

