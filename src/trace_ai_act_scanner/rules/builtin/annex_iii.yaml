# EU AI Act — Annex III (High-Risk AI Systems)
# https://artificialintelligenceact.eu/annex/3/

- id: AIII_BIOMETRICS_HIGH_RISK
  bucket: annex_iii_high_risk_signal
  legal_basis: "EU AI Act Annex III(1)"
  label: "Potential high-risk biometric system"
  severity: HIGH_RISK_REVIEW
  weight: 28
  exact_terms:
    - biometric
    - facial_recognition
    - face_recognition
    - voiceprint
    - gait
    - iris
    - fingerprint
    - emotion_recognition
  phrases:
    - "remote biometric"
    - "biometric verification"
    - "biometric categorisation"
    - "biometric categorization"
  context_terms:
    - identify
    - verify
    - authenticate
    - classify
    - categorize
    - recognize
  guidance: >
    Biometric verification may be excluded from some high-risk categories
    if used only for authentication; document purpose.
  contradicts_public_claims:
    - "no biometric data"
    - "no facial recognition"

