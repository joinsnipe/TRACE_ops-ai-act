- id: AIII_EDUCATION_VOCATIONAL
  bucket: annex_iii_high_risk_signal
  legal_basis: "EU AI Act Annex III(3)"
  label: "Potential high-risk education/vocational training system"
  severity: HIGH_RISK_REVIEW
  weight: 26
  exact_terms:
    - admission_score
    - student_score
