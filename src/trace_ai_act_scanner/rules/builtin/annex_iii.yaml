    - smart_grid
    - traffic_control
    - electricity_grid
    - gas_control
    - water_supply
    - heating_network
    - dns_routing_ai
  phrases:
    - "critical infrastructure"
    - "road traffic"
    - "water supply"
    - "electricity grid"
    - "gas supply"
  context_terms:
    - safety
    - operation
    - control
    - dispatch
    - routing
