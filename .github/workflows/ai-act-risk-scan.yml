name: TRACE AI Act Risk Scan

on:
  push:
  pull_request:

jobs:
  ai-act-risk-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TRACE AI Act Risk Scanner
        run: |
          python trace_ai_act_risk_scanner.py . --json
